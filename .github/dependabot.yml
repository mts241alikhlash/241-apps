version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nest:
        patterns: ['@nestjs/*', 'nestjs-*', 'rxjs', 'reflect-metadata']
      vue:
        patterns:
          [
            'vue',
            'vue-*',
            '@vue/*',
            'pinia',
            '@vitejs/*',
            'vite',
            '@tanstack/*',
            'reka-ui',
            '@vueuse/*',
          ]
      lint:
        patterns:
          [
            'eslint',
            'eslint-*',
            '@eslint/*',
            'typescript-eslint',
            '@typescript-eslint/*',
            'prettier',
            'globals',
            'knip',
            'husky',
            'lint-staged',
          ]
      test:
        patterns:
          [
            'vitest',
            '@vitest/*',
            'happy-dom',
            '@vue/test-utils',
            'supertest',
            'unplugin-swc',
          ]
      types:
        patterns: ['@types/*']
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vueuse/core'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']
      - dependency-name: '@tanstack/vue-table'
        update-types: ['version-update:semver-major']
      - dependency-name: '@fullcalendar/core'
        update-types: ['version-update:semver-major']
      - dependency-name: '@fullcalendar/daygrid'
        update-types: ['version-update:semver-major']
      - dependency-name: '@fullcalendar/interaction'
        update-types: ['version-update:semver-major']
      - dependency-name: '@fullcalendar/vue3'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vue-tsc'
      - dependency-name: '@vue/language-core'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
