name: Update lock

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-lock
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test infra/scripts/update-lock.test.mjs
      - name: Pin released apps and services
        run: node infra/scripts/update-lock.mjs | tee "$RUNNER_TEMP/changes.txt"
      - name: Render and check the gateway
        run: |
          node infra/gateway/generate.mjs > /dev/null
          node infra/gateway/generate.mjs --check
          node infra/gateway/generate.self-check.mjs
      - id: gateway
        name: Content address the gateway
        run: |
          tag="$(node infra/scripts/update-lock.mjs --gateway-tag)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        env:
          TAG: ${{ steps.gateway.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "ghcr.io/mts241alikhlash/gateway:$TAG" > /dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        if: steps.exists.outputs.built == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/gateway/Dockerfile
          push: true
          tags: ghcr.io/mts241alikhlash/gateway:${{ steps.gateway.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.gateway.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - if: steps.exists.outputs.built == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/mts241alikhlash/gateway
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Pin the gateway and validate the lock
        env:
          TAG: ${{ steps.gateway.outputs.tag }}
        run: |
          node infra/scripts/update-lock.mjs --pin-gateway "$TAG" | tee -a "$RUNNER_TEMP/changes.txt"
          node infra/deployment/validate-lock.mjs
          {
            echo "Pins the lock and the Compose file to:"
            echo
            sed 's/^/- /' "$RUNNER_TEMP/changes.txt"
          } > "$RUNNER_TEMP/body.md"
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: mts241alikhlash
          repositories: 241-apps
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/update-lock
          base: main
          title: Update the lock
          commit-message: Update the lock
          body-path: ${{ runner.temp }}/body.md
          add-paths: |
            infra/deployment
            infra/compose
            infra/gateway
