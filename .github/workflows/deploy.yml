name: Deploy

on:
  push:
    branches: [main]
    paths:
      - infra/deployment/lock.json
      - infra/compose/**
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or sha to deploy (a tag deploy-* is a rollback)
        type: string
        default: main
        required: true

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            sha="$(git rev-parse --verify --quiet "origin/$INPUT_REF^{commit}" || git rev-parse --verify "$INPUT_REF^{commit}")"
          else
            sha="$GITHUB_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploy $sha" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: plan
    runs-on: ubuntu-24.04
    permissions: {}
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST" "$SHA"

  tag:
    needs: [plan, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Tag the deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          tag="deploy-$(date -u +%F)-${SHA::7}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "Tag $tag already exists" >> "$GITHUB_STEP_SUMMARY"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SHA" > /dev/null
            echo "Tagged $tag" >> "$GITHUB_STEP_SUMMARY"
          fi
