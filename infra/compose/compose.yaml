  exam-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/exam-service@sha256:7007d6d573090e386e26c67afb209f61561ac00e7af93b4927ce293312f43015
    env_file:
      - path: env/exam-service.env
