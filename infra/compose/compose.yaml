  identity-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/identity-service@sha256:fedccca48b42c3a0703e09a58df84327e3515e1bea97b1426bf15737551a347d
    env_file:
      - path: env/identity-service.env
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  academic-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/academic-service@sha256:3861295a009b2e35d33ac7e7a97e788d9e0f64eeafddbb72000daca5e3a25c58
    env_file:
      - path: env/academic-service.env
    expose:
