name: 241-apps

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-web-defaults: &web-defaults
  restart: unless-stopped
  logging: *logging
  expose:
    - '8080'
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - platform-net

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging
  mem_limit: 320m
  environment:
    TRUST_PROXY: '${TRUST_PROXY:-1}'
    NODE_OPTIONS: '--max-old-space-size=256'
  networks:
    - platform-net

x-migrate-defaults: &migrate-defaults
  restart: 'no'
  logging: *logging
  entrypoint: ['./node_modules/.bin/prisma']
  command: ['migrate', 'deploy']
  networks:
    - platform-net

services:
  gateway:
    logging: *logging
    image: ghcr.io/mts241alikhlash/gateway@sha256:8bd891aa2dcb3af1a6796f7e7f6eb7dcbe82bbcca2f15a534792092da015d9df
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      academic-web:
        condition: service_healthy
      admission-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      assessment-web:
        condition: service_healthy
      hr-web:
        condition: service_healthy
      account-web:
        condition: service_healthy
      inventory-web:
        condition: service_healthy
      portal-web:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      exam-web:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      portal-service:
        condition: service_healthy
      admission-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy
    networks:
      - platform-net

  academic-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/academic-web@sha256:2e6e22c7c352a126353608fd9ad42f56cd88121e51ae303101266b950925b51b

  admission-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admission-web@sha256:dc65bf885c833ffdd215d513dca4542e2c2ecdfe9886b897eab2c8f4a1dce320

  admin-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admin-web@sha256:4cc12e25d025f30ed66d0f148508225a78493a474b4b348074e20a56e0b0fdf0

  assessment-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/assessment-web@sha256:e3ff28b368d878a73aafd0084e8c28ad7f6c6dc5dd796c5260b969ce60aedf14

  hr-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/hr-web@sha256:43432be326d5fb1b3bb229704e17b54533858210f6264ae914968eca1fde665c

  account-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/account-web@sha256:768de441cbd9da80bd0f62c22b97b34a2870b827384ea815797efc6a2b46c04a

  inventory-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/inventory-web@sha256:562857d101edf2f628fb6b72862a1b37e0b248c1e68dab5a448e6daec5a85300

  portal-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/portal-web@sha256:890346dc5ccacec196ed95c704165f923e80e996f348769e0c252de6c60f116f

  exam-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/exam-web@sha256:a2af75e2e2c14cc6cd8d735e8cd64804a1db43c77d7cfb2fc7a311cd270fd20b
  identity-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/identity-service@sha256:9d115f1a3a467fa5668e2377fd35969d6396ce9f6f20a44e0302bb5863db34e0
    env_file:
      - path: env/identity-service.env
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  academic-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/academic-service@sha256:220da083744c0eb6a3c615bb6be1a95cd3356f71225d826a9398360a585bb1fa
    env_file:
      - path: env/academic-service.env
    expose:
      - '3200'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3200/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  inventory-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/inventory-service@sha256:86b221319ebe4a8c4e82b728d452f7c29032a424d9bd07e81439789a1f3b8280
    env_file:
