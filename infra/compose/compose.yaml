name: 241-apps

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-web-defaults: &web-defaults
  restart: unless-stopped
  logging: *logging
  expose:
    - '8080'
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - platform-net

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging
  mem_limit: 320m
  environment:
    TRUST_PROXY: '${TRUST_PROXY:-1}'
    NODE_OPTIONS: '--max-old-space-size=256'
  networks:
    - platform-net

x-migrate-defaults: &migrate-defaults
  restart: 'no'
  logging: *logging
  entrypoint: ['./node_modules/.bin/prisma']
  command: ['migrate', 'deploy']
  networks:
    - platform-net

services:
  gateway:
    logging: *logging
    image: ghcr.io/mts241alikhlash/gateway@sha256:ec066b94827aef3bade5483c5a31395ed4ca0b459f9b8f3fad57032da335ccf8
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      academic-web:
        condition: service_healthy
      admission-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      assessment-web:
        condition: service_healthy
      hr-web:
        condition: service_healthy
      account-web:
        condition: service_healthy
      inventory-web:
        condition: service_healthy
      portal-web:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      exam-web:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      portal-service:
        condition: service_healthy
      admission-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy
    networks:
      - platform-net

  academic-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/academic-web@sha256:df332eaaf3aa0608cfb3f41c4dd72a568b7b8aac260a8d553521c48ef7222ecb

  admission-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admission-web@sha256:54043e47d2ff654ce6faecc3eeab208ee69784a7d1e40fc0f143528fc75d2065

  admin-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admin-web@sha256:92d17de05c1345d0492eb1d78a50991d970de5ab85a89ada40dbeb2aa474ed1b

  assessment-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/assessment-web@sha256:448389b69ddb05759b13397146baf7f5287740d21ab6583292fab396f7c6ef06

  hr-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/hr-web@sha256:39f7ddaf9ef3314dab76723aaf44969d34e97830951785b69f4ce363bab29c17

  account-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/account-web@sha256:0eccdc5cc31c9ab22eedbaa30bc4d9d17f268208d08492b129ceffce964e0aea

  inventory-web:
