  inventory-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/inventory-service@sha256:203da7caec8a096720c296d8db1bda2190abfd540cef64aac5a245951363f1b1
    profiles: ['migrate']
    env_file:
      - path: env/inventory-service.env

  presence-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/presence-service@sha256:992e6388c902fe4d0f563e9bd639b5a38b1d15926d42c6648ecff17cad23a39a
    profiles: ['migrate']
    env_file:
      - path: env/presence-service.env

  portal-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/portal-service@sha256:ca27d8efc09df85bb44365a3a14565a20a42f148dd42cc4297016130e67329ec
    profiles: ['migrate']
    env_file:
      - path: env/portal-service.env

  admission-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/admission-service@sha256:2182c7d61331fdbfaa2f2bb9a0c344b2b26db88bc0d3d6d2b5f7a876c4102198
    profiles: ['migrate']
    env_file:
      - path: env/admission-service.env

  hr-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/hr-service@sha256:3347af82a071b152c96a1ef40dc08c9a9a2996c0c93f5a6a4433ed1d3f073f66
    profiles: ['migrate']
    env_file:
      - path: env/hr-service.env

  student-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/student-service@sha256:7547c5e989d535547b4db3731aa57f36908c59828d2fcb4d67026075ec617e90
    profiles: ['migrate']
    env_file:
      - path: env/student-service.env

  assessment-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/assessment-service@sha256:5cb1ed8d2a7213abd40a0384bfd29f88c890d253527e628b236a1c3a3d395606
    profiles: ['migrate']
    env_file:
      - path: env/assessment-service.env

  exam-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/exam-service@sha256:bdc0575b26cc0c3f1c50f79bdc83a925ccc6d5d12e304abf5e4c5fd5483c3243
    profiles: ['migrate']
    env_file:
      - path: env/exam-service.env

  postgres:
    profiles: ['storage']
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: mts241
      POSTGRES_PASSWORD: mts241
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../gateway-source/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro,z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mts241 -d identity']
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    profiles: ['storage']
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: server -s3 -dir=/data
    ports:
      - '9000:8333'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8333']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  s3-data:

networks:
  platform-net:
    name: 241-apps
    external: true
