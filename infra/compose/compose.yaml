  admission-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/admission-service@sha256:733bf37772f26c3b080374b142717a7c89a111f4fa80547e456f123f00c5cd32
    env_file:
      - path: env/admission-service.env
    expose:
      - '3700'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3700/health']
      interval: 15s
