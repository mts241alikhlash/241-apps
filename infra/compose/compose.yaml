name: 241-apps

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-web-defaults: &web-defaults
  restart: unless-stopped
  logging: *logging
  expose:
    - '8080'
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - platform-net

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging
  mem_limit: 320m
  environment:
    TRUST_PROXY: '${TRUST_PROXY:-1}'
    NODE_OPTIONS: '--max-old-space-size=256'
  networks:
    - platform-net

x-migrate-defaults: &migrate-defaults
  restart: 'no'
  logging: *logging
  entrypoint: ['./node_modules/.bin/prisma']
  command: ['migrate', 'deploy']
  networks:
    - platform-net

services:
  gateway:
    logging: *logging
    image: ghcr.io/mts241alikhlash/gateway@sha256:bb20d77c08308a45df9b58d5761c7393ed996f918c8e90513c56f01082c6bd34
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      academic-web:
        condition: service_healthy
      admission-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      assessment-web:
        condition: service_healthy
      hr-web:
        condition: service_healthy
      account-web:
        condition: service_healthy
      inventory-web:
        condition: service_healthy
      portal-web:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      exam-web:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      portal-service:
        condition: service_healthy
      admission-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy
    networks:
      - platform-net

  academic-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/academic-web@sha256:d6f5b133c9cd3c51034388e4cce7db15a8404d64cffd0c23b099e13a54a49a35

  admission-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admission-web@sha256:9a704181648bd8de289898ad46440fa1ec2166c70e1e7211ab73a6be134f9357

  admin-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admin-web@sha256:443a8760f842931a91a59cec7019d8bba1398b968d584f314d315f1af4570635

  assessment-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/assessment-web@sha256:a7a29b1e6ab8520486102254a4f907b498e815dd0e456c7dcdca39b20fa22690

  hr-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/hr-web@sha256:ada57764ca81c5eb09e331a6b0103ecf5bb6e78dfd6f852db375395d8321ce7d

  account-web:
    <<: *web-defaults
