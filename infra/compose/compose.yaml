name: 241-apps

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-web-defaults: &web-defaults
  restart: unless-stopped
  logging: *logging
  expose:
    - '8080'
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - platform-net

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging
  mem_limit: 320m
  environment:
    TRUST_PROXY: '${TRUST_PROXY:-1}'
    NODE_OPTIONS: '--max-old-space-size=256'
  networks:
    - platform-net

x-migrate-defaults: &migrate-defaults
  restart: 'no'
  logging: *logging
  entrypoint: ['./node_modules/.bin/prisma']
  command: ['migrate', 'deploy']
  networks:
    - platform-net

services:
  gateway:
    logging: *logging
    image: ghcr.io/mts241alikhlash/gateway@sha256:ec066b94827aef3bade5483c5a31395ed4ca0b459f9b8f3fad57032da335ccf8
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      academic-web:
        condition: service_healthy
      admission-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      assessment-web:
        condition: service_healthy
      hr-web:
        condition: service_healthy
      account-web:
        condition: service_healthy
      inventory-web:
        condition: service_healthy
      portal-web:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      exam-web:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      portal-service:
        condition: service_healthy
      admission-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy
    networks:
      - platform-net

  academic-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/academic-web@sha256:95ca795ca87c6496c4ffd9b80cf3ff94dc5ffd1d910e39a8730541da3850e00c

  admission-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admission-web@sha256:f1d605eb8d31e30299fb0869e4be6773d0b4f16e3b3ef89315f7cfbc0ba884bd

  admin-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admin-web@sha256:61c483b586cc301abe147fd97b406b16e5c80016f7ba57f97862aad03a72905e

  assessment-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/assessment-web@sha256:653c65c14985d8953028e74af5369b846d6ee045888f8b10e97bb18554d68351

  hr-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/hr-web@sha256:ff91ac1798df1d466ceedd3bc45d66f01c7d863173ec919224ea2cf99c75e59c

  account-web:
