  exam-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/exam-service@sha256:4a11675ed597b30b9318b755a443efd3cd92efb4531a3fea6121c92495499857
    env_file:
      - path: env/exam-service.env
    expose:
      - '4100'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4100/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  identity-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/identity-service@sha256:ea4aef1ec1410366d8a488a9b119cde4d099d7c1d5c44d914f0c645eb079b14a
    profiles: ['migrate']
    env_file:
      - path: env/identity-service.env

  academic-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/academic-service@sha256:9a462393fc7600003b39e3d3bd596fdcbcc3dff13879bb32f9ecf7fcec550c31
    profiles: ['migrate']
    env_file:
      - path: env/academic-service.env

  inventory-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/inventory-service@sha256:3de2c373f335027cff093be72640fc77f44ecd7fb024dc15722fe29eb7e696dc
    profiles: ['migrate']
    env_file:
      - path: env/inventory-service.env

  presence-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/presence-service@sha256:0cabaafe1e838d71dbbf9851b008420c8bfdde8b27f6afcb9c05f214586444ac
    profiles: ['migrate']
    env_file:
      - path: env/presence-service.env

  portal-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/portal-service@sha256:a63990479950051d392d293015e554e9345d594bb6c05740c1aa16114377092e
    profiles: ['migrate']
    env_file:
      - path: env/portal-service.env

  admission-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/admission-service@sha256:6a115ebfc8552cc0ab1603c8ed9a649eed3b7dbb73f6478807f8919b3e00866b
    profiles: ['migrate']
    env_file:
      - path: env/admission-service.env

  hr-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/hr-service@sha256:f8bb4a293e43dc2d843cf578bf0a58dae9fd4a6a95f9e48b39b8a57498cae96a
    profiles: ['migrate']
    env_file:
      - path: env/hr-service.env

  student-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/student-service@sha256:4ec1809f05a0c67eaf9097aaf6e81f9396ad29de25f125214849a416b63c9c20
    profiles: ['migrate']
    env_file:
      - path: env/student-service.env

  assessment-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/assessment-service@sha256:ac7dff4a30a6f76682e9df0b6ce0c28c8c374ab5eec3986a61b3e1c4675fd02c
    profiles: ['migrate']
    env_file:
      - path: env/assessment-service.env

  exam-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/exam-service@sha256:4a11675ed597b30b9318b755a443efd3cd92efb4531a3fea6121c92495499857
    profiles: ['migrate']
    env_file:
      - path: env/exam-service.env

  postgres:
    profiles: ['storage']
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: mts241
      POSTGRES_PASSWORD: mts241
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../gateway-source/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro,z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mts241 -d identity']
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    profiles: ['storage']
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: server -s3 -dir=/data
    ports:
      - '9000:8333'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8333']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  s3-data:

networks:
  platform-net:
    name: 241-apps
    external: true
