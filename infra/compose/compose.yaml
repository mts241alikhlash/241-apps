      timeout: 5s
      retries: 5
      start_period: 30s

  identity-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/identity-service@sha256:82b1543ffd8c343c074a432fb8adffb660aa07f57ed500b6a8ee1d7ead14ccf3
    profiles: ['migrate']
    env_file:
      - path: env/identity-service.env

  academic-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/academic-service@sha256:3861295a009b2e35d33ac7e7a97e788d9e0f64eeafddbb72000daca5e3a25c58
    profiles: ['migrate']
    env_file:
