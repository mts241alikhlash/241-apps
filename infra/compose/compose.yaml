  exam-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/exam-web@sha256:98346fda7557fba41e79ba3e6916cb812ed23cb2acb369b3b2c96d9b839c8275
  identity-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/identity-service@sha256:ea4aef1ec1410366d8a488a9b119cde4d099d7c1d5c44d914f0c645eb079b14a
    env_file:
      - path: env/identity-service.env
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  academic-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/academic-service@sha256:9a462393fc7600003b39e3d3bd596fdcbcc3dff13879bb32f9ecf7fcec550c31
    env_file:
      - path: env/academic-service.env
    expose:
      - '3200'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3200/health']
      interval: 15s
      timeout: 5s
      retries: 5
