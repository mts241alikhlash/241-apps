    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3400/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  portal-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/portal-service@sha256:853c7b6a551b6d5080b4945e530914746d2e841e39d9c217ebe9c1b78a57c96f
    env_file:
      - path: env/portal-service.env
    expose:
      - '3600'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3600/health']
