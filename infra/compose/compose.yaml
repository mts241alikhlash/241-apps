  inventory-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/inventory-service@sha256:86b221319ebe4a8c4e82b728d452f7c29032a424d9bd07e81439789a1f3b8280
    profiles: ['migrate']
    env_file:
      - path: env/inventory-service.env

  presence-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/presence-service@sha256:8f3dc052f4ef95ee82ec9f8d8eabf844d6dfc92cc921332a05654b1fbec92e5f
    profiles: ['migrate']
    env_file:
      - path: env/presence-service.env

  portal-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/portal-service@sha256:853c7b6a551b6d5080b4945e530914746d2e841e39d9c217ebe9c1b78a57c96f
    profiles: ['migrate']
    env_file:
      - path: env/portal-service.env

  admission-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/admission-service@sha256:733bf37772f26c3b080374b142717a7c89a111f4fa80547e456f123f00c5cd32
    profiles: ['migrate']
    env_file:
      - path: env/admission-service.env

  hr-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/hr-service@sha256:64466b24611ba5fd20805a628a2fc6c17e18e11a769b60abcb856ff6d14fe8fc
    profiles: ['migrate']
    env_file:
      - path: env/hr-service.env

  student-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/student-service@sha256:dca1a413fe1519c77b45a382ca2bab51b270d00e81108dd26d95ea1477100885
    profiles: ['migrate']
    env_file:
      - path: env/student-service.env

  assessment-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/assessment-service@sha256:6e59eb4a11e371b18b3912e8b8da49182229089a0a51d1161baf209f1f46f670
    profiles: ['migrate']
    env_file:
      - path: env/assessment-service.env

  exam-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/exam-service@sha256:f36fee101e00bdace15f7e4ef9a3a2e8d501741234c01c8c8b7a32c07456b69e
    profiles: ['migrate']
    env_file:
      - path: env/exam-service.env

  postgres:
    profiles: ['storage']
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: mts241
      POSTGRES_PASSWORD: mts241
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../gateway-source/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro,z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mts241 -d identity']
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    profiles: ['storage']
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: server -s3 -dir=/data
    ports:
      - '9000:8333'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8333']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  s3-data:

networks:
  platform-net:
    name: 241-apps
    external: true
