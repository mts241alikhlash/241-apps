    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/identity-service@sha256:13dd18683b84fb561dc8d6cb9b7231874f57ef2f1a7968366c16a786ce638575
    profiles: ['migrate']
    env_file:
      - path: env/identity-service.env

  academic-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/academic-service@sha256:300c5ee651139b4d013044f9a6954639e4d643872c2da38af89ec0afee02a757
    profiles: ['migrate']
    env_file:
