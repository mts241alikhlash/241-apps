  exam-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/exam-web@sha256:d84652ebdb275e8ab628be322419934b55fe2c288dfed48a6233b6bfdba44cd0
  identity-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/identity-service@sha256:ac4eea6d2eef01a8c2049f8855f44731c62c2acdf399389e3d7bc2d9c3d566f7
    env_file:
      - path: env/identity-service.env
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  academic-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/academic-service@sha256:3861295a009b2e35d33ac7e7a97e788d9e0f64eeafddbb72000daca5e3a25c58
    env_file:
      - path: env/academic-service.env
    expose:
