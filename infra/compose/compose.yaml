name: 241-apps

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-web-defaults: &web-defaults
  restart: unless-stopped
  logging: *logging
  expose:
    - '8080'
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - platform-net

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging
  mem_limit: 320m
  environment:
    TRUST_PROXY: '${TRUST_PROXY:-1}'
    NODE_OPTIONS: '--max-old-space-size=256'
  networks:
    - platform-net

x-migrate-defaults: &migrate-defaults
  restart: 'no'
  logging: *logging
  entrypoint: ['./node_modules/.bin/prisma']
  command: ['migrate', 'deploy']
  networks:
    - platform-net

services:
  gateway:
    logging: *logging
    image: ghcr.io/mts241alikhlash/gateway@sha256:0ff5984792c15167a02fc795b59cde812c9d37cd5de5e1e3fd6aeaa7f564271c
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      academic-web:
        condition: service_healthy
      admission-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      assessment-web:
        condition: service_healthy
      hr-web:
        condition: service_healthy
      account-web:
        condition: service_healthy
      inventory-web:
        condition: service_healthy
      portal-web:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      exam-web:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      portal-service:
        condition: service_healthy
      admission-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy
    networks:
      - platform-net

  academic-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/academic-web@sha256:1f9d2738dcb9569d28657cbada3f4f076d7f78bec2c3064ea7e1721091b06fc1

  admission-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admission-web@sha256:55e8a8c79f55cf08406907c952bd0cf5e24e52467eaf9bdc2f5f16db9fe8d7ca

  admin-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admin-web@sha256:2247de5cb709e81a8f44906afcec3a763703b32c17c2e239804c2ee091119de2

  assessment-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/assessment-web@sha256:76be118e82f86362931decf2e10e3e4fad4984c0c2c11098bc8ff411a999339f

  hr-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/hr-web@sha256:2333352c741bc43ec665d49f1d3ea96651883350015504e0cb9c8f4c47d43804

  account-web:
    <<: *web-defaults
