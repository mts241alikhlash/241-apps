name: 241-apps

services:
  postgres:
    profiles: ["storage"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: mts241
      POSTGRES_PASSWORD: mts241
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../gateway-source/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mts241 -d identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    profiles: ["storage"]
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: server -s3 -dir=/data
    ports:
      - "9000:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  s3-data:
