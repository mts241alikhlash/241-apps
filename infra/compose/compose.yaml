      - path: env/presence-service.env
    expose:
      - '3400'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3400/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  portal-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/portal-service@sha256:a63990479950051d392d293015e554e9345d594bb6c05740c1aa16114377092e
    env_file:
      - path: env/portal-service.env
    expose:
      - '3600'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3600/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  admission-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/admission-service@sha256:6a115ebfc8552cc0ab1603c8ed9a649eed3b7dbb73f6478807f8919b3e00866b
    env_file:
      - path: env/admission-service.env
    expose:
      - '3700'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3700/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  hr-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/hr-service@sha256:f8bb4a293e43dc2d843cf578bf0a58dae9fd4a6a95f9e48b39b8a57498cae96a
