  exam-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/exam-web@sha256:dee5201cc55724c9f5c68eb71c9e054c022977fb7267485498a7312befa4cf9d
  identity-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/identity-service@sha256:3acc479f2a8f09b49ad268f13493c8389a5a8585ab5fbbe51e7e309973a9a22e
    env_file:
      - path: env/identity-service.env
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  academic-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/academic-service@sha256:9a462393fc7600003b39e3d3bd596fdcbcc3dff13879bb32f9ecf7fcec550c31
    env_file:
      - path: env/academic-service.env
    expose:
