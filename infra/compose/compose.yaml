    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3300/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  presence-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/presence-service@sha256:fb07069d85eea406ba165658792564317ff9de40a57b1c7afedad896cac98fbb
    env_file:
      - path: env/presence-service.env
    expose:
      - '3400'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3400/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  portal-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/portal-service@sha256:853c7b6a551b6d5080b4945e530914746d2e841e39d9c217ebe9c1b78a57c96f
    env_file:
      - path: env/portal-service.env
    expose:
      - '3600'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3600/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  admission-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/admission-service@sha256:733bf37772f26c3b080374b142717a7c89a111f4fa80547e456f123f00c5cd32
    env_file:
      - path: env/admission-service.env
    expose:
      - '3700'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3700/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  hr-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/hr-service@sha256:9e5031b4b8153b66712c8e741ea637480a546a3058cf5e3046ad99dba5fdbfbc
    env_file:
      - path: env/hr-service.env
    expose:
      - '3800'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3800/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  student-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/student-service@sha256:a002f950a4b3f96f4e133c40688b056ad007a7c20e38d7237df23eed333a6e7c
    env_file:
      - path: env/student-service.env
    expose:
      - '3900'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3900/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  assessment-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/assessment-service@sha256:8485f7c6941d1add9d4456ddb5f52375dce63a816ab88f179aee9f684e49722f
    env_file:
      - path: env/assessment-service.env
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  exam-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/exam-service@sha256:f54bc9c7b1f5f92156a51fe4711291d5f7a0d129d9358a0b25ba928917b70b82
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    mem_limit: 768m
    environment:
      TRUST_PROXY: '${TRUST_PROXY:-1}'
      NODE_OPTIONS: '--max-old-space-size=576'
    env_file:
      - path: env/exam-service.env
    expose:
      - '4100'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4100/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  identity-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/identity-service@sha256:9d115f1a3a467fa5668e2377fd35969d6396ce9f6f20a44e0302bb5863db34e0
    profiles: ['migrate']
    env_file:
      - path: env/identity-service.env

  academic-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/academic-service@sha256:220da083744c0eb6a3c615bb6be1a95cd3356f71225d826a9398360a585bb1fa
    profiles: ['migrate']
    env_file:
      - path: env/academic-service.env

  inventory-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/inventory-service@sha256:86b221319ebe4a8c4e82b728d452f7c29032a424d9bd07e81439789a1f3b8280
    profiles: ['migrate']
    env_file:
      - path: env/inventory-service.env

  presence-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/presence-service@sha256:fb07069d85eea406ba165658792564317ff9de40a57b1c7afedad896cac98fbb
    profiles: ['migrate']
    env_file:
      - path: env/presence-service.env

  portal-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/portal-service@sha256:853c7b6a551b6d5080b4945e530914746d2e841e39d9c217ebe9c1b78a57c96f
    profiles: ['migrate']
    env_file:
      - path: env/portal-service.env

  admission-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/admission-service@sha256:733bf37772f26c3b080374b142717a7c89a111f4fa80547e456f123f00c5cd32
    profiles: ['migrate']
    env_file:
      - path: env/admission-service.env

  hr-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/hr-service@sha256:9e5031b4b8153b66712c8e741ea637480a546a3058cf5e3046ad99dba5fdbfbc
    profiles: ['migrate']
    env_file:
      - path: env/hr-service.env

  student-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/student-service@sha256:a002f950a4b3f96f4e133c40688b056ad007a7c20e38d7237df23eed333a6e7c
    profiles: ['migrate']
    env_file:
      - path: env/student-service.env

  assessment-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/assessment-service@sha256:8485f7c6941d1add9d4456ddb5f52375dce63a816ab88f179aee9f684e49722f
    profiles: ['migrate']
    env_file:
      - path: env/assessment-service.env

  exam-service-migrate:
    <<: *migrate-defaults
    image: ghcr.io/mts241alikhlash/exam-service@sha256:f54bc9c7b1f5f92156a51fe4711291d5f7a0d129d9358a0b25ba928917b70b82
    profiles: ['migrate']
    env_file:
      - path: env/exam-service.env

  postgres:
    profiles: ['storage']
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: mts241
      POSTGRES_PASSWORD: mts241
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../gateway-source/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro,z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mts241 -d identity']
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    profiles: ['storage']
    image: chrislusf/seaweedfs
    restart: unless-stopped
    command: server -s3 -dir=/data
    ports:
      - '9000:8333'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 8333']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  s3-data:

networks:
  platform-net:
    name: 241-apps
    external: true
