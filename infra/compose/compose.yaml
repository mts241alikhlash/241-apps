      retries: 5
      start_period: 30s

  assessment-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/assessment-service@sha256:ac7dff4a30a6f76682e9df0b6ce0c28c8c374ab5eec3986a61b3e1c4675fd02c
    env_file:
      - path: env/assessment-service.env
    expose:
      - '4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 15s
      timeout: 5s
