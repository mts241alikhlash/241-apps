name: 241-apps

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-web-defaults: &web-defaults
  restart: unless-stopped
  logging: *logging
  expose:
    - '8080'
  healthcheck:
    test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - platform-net

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging
  mem_limit: 320m
  environment:
    TRUST_PROXY: '${TRUST_PROXY:-1}'
    NODE_OPTIONS: '--max-old-space-size=256'
  networks:
    - platform-net

x-migrate-defaults: &migrate-defaults
  restart: 'no'
  logging: *logging
  entrypoint: ['./node_modules/.bin/prisma']
  command: ['migrate', 'deploy']
  networks:
    - platform-net

services:
  gateway:
    logging: *logging
    image: ghcr.io/mts241alikhlash/gateway@sha256:ec066b94827aef3bade5483c5a31395ed4ca0b459f9b8f3fad57032da335ccf8
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      academic-web:
        condition: service_healthy
      admission-web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      assessment-web:
        condition: service_healthy
      hr-web:
        condition: service_healthy
      account-web:
        condition: service_healthy
      inventory-web:
        condition: service_healthy
      portal-web:
        condition: service_healthy
      identity-service:
        condition: service_healthy
      exam-web:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      presence-service:
        condition: service_healthy
      portal-service:
        condition: service_healthy
      admission-service:
        condition: service_healthy
      hr-service:
        condition: service_healthy
      student-service:
        condition: service_healthy
      assessment-service:
        condition: service_healthy
      exam-service:
        condition: service_healthy
    networks:
      - platform-net

  academic-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/academic-web@sha256:4c228f859c78a1a1359da78f89f9fc7a1aa2fef8896317cdb0c9494c1d493c3f

  admission-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admission-web@sha256:91fb3aaa181673874362efc3b4152c9c1524cd6365d8c9da81136a068dab3647

  admin-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/admin-web@sha256:972feca432337581d99033d0d6fbb5085f4d91b82d19b165d8d2e594395fdc43

  assessment-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/assessment-web@sha256:cfe792f949eb488f313f5e8a84279884db10333277e4b8683f1b33f6139bb0f0

  hr-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/hr-web@sha256:e323033db1cc4ba90e72a6f38717cbaa45f574d65eca1a557e504a13c4bdd146

  account-web:
