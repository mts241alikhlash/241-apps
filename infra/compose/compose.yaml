  exam-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/exam-web@sha256:067ccfdc37682a3bd6b9bebfe57c385ab3ed1e502e1215e1e6b85fa4e94db669
  identity-service:
