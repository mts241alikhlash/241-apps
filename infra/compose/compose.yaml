  exam-web:
    <<: *web-defaults
    image: ghcr.io/mts241alikhlash/exam-web@sha256:7133e2136bdd2701f0daf540ffaa17e524fb100fff5152074329b0ffe9f84a2f
  identity-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/identity-service@sha256:1d1c164d8edb7509ddbc9107899f3afee4551bf847f9ae47108a5a41b63477ee
    env_file:
      - path: env/identity-service.env
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  academic-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/academic-service@sha256:9a462393fc7600003b39e3d3bd596fdcbcc3dff13879bb32f9ecf7fcec550c31
    env_file:
      - path: env/academic-service.env
    expose:
      - '3200'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3200/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  inventory-service:
