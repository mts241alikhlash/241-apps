      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3400/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  portal-service:
    <<: *service-defaults
    image: ghcr.io/mts241alikhlash/portal-service@sha256:ca27d8efc09df85bb44365a3a14565a20a42f148dd42cc4297016130e67329ec
