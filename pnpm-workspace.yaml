packages:
  - 'apps/*'
  - 'services/*'
  - 'packages/*'
  - 'infra'

overrides:
  'brace-expansion@1': '^1.1.21'
  'brace-expansion@5': '^5.0.12'
  'hono': '^4.12.34'
  '@hono/node-server': '^1.19.15'
  'valibot': '^1.4.2'
  'js-yaml@5': '^5.2.2'
  'brace-expansion@2': '^2.1.7'
  'uuid': '^11.1.1'
  'deepmerge-ts': '^8.0.0'
  'multer': '^2.4.0'
  'mysql2': '^3.23.1'
  'fast-uri': '^3.1.8'
  '@vue/test-utils': '2.5.0'
  'vue-component-type-helpers': '3.3.11'
  '@nestjs/swagger': '12.0.1'
  'vue-tsc': '3.3.11'
  '@vue/language-core': '3.3.11'

allowBuilds:
  'esbuild': true
  'maplibre-gl': true
  'vue-demi': true
  '@parcel/watcher': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  'bcrypt': true
  'prisma': true
  'puppeteer': true
  'sharp': true
  'unrs-resolver': true

minimumReleaseAgeExclude:
  - '@mts241alikhlash/*'
